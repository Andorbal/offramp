name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test --no-build -c Release --filter "Category!=Corpus&Category!=Slow"

  publish:
    name: Pack, publish to NuGet, create GitHub Release
    needs: test
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: |
          dotnet pack src/Offramp.Cli -c Release -o artifacts
          # The Offramp.Analyzers package (analyzers and code fixes) is packed by the CodeFixes project.
          dotnet pack src/Offramp.Analyzers.CodeFixes -c Release -o artifacts
          ls -l artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package the VS Code extension
        working-directory: editors/vscode
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Extension versions are major.minor.patch; a prerelease tag keeps only that part.
          VERSION="${REF_NAME#v}"
          npm ci
          npm version --no-git-tag-version --allow-same-version "${VERSION%%-*}"
          npm test
          npx vsce package --out "../../artifacts/offramp-vscode-${VERSION}.vsix"

      - name: Derive version from tag
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Extract changelog section
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x eng/changelog-section.sh
          eng/changelog-section.sh "$VERSION" > release-notes.md
          cat release-notes.md

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for pkg in artifacts/*.nupkg; do
            dotnet nuget push "$pkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      # After the tool is on NuGet: the extension needs the offramp version it ships with.
      # Stable tags only (a prerelease tag would take the stable version number on the Marketplace).
      - name: Publish the VS Code extension
        if: steps.ver.outputs.prerelease == 'false'
        working-directory: editors/vscode
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          vsix="../../artifacts/offramp-vscode-${VERSION}.vsix"
          if [ -n "$VSCE_PAT" ]; then
            npx vsce publish --packagePath "$vsix"
          else
            echo "::warning::VSCE_PAT is not set, so the extension was not published to the Visual Studio Marketplace."
          fi
          if [ -n "$OVSX_PAT" ]; then
            npx --yes ovsx@1.2.0 publish "$vsix" --pat "$OVSX_PAT"
          else
            echo "OVSX_PAT is not set; skipping Open VSX."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Offramp ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: |
            artifacts/*.nupkg
            artifacts/*.vsix
