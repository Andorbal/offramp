name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Roadmap M1 acceptance: the model built from logs of dual-target captured on
  # Windows must equal the native one on every OS. This job captures the logs;
  # build-test compares (ScanFixtureTests.Logs_captured_on_windows_produce_the_native_model).
  windows-capture:
    name: Windows capture (dual-target)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Scan dual-target on Windows
        shell: bash
        run: |
          capture="$RUNNER_TEMP/dual-target"
          cp -r tests/fixtures/dual-target "$capture"
          dotnet build src/Offramp.Cli -c Release -f net10.0 -nologo
          cd "$capture"
          git init -q
          dotnet "$GITHUB_WORKSPACE/src/Offramp.Cli/bin/Release/net10.0/offramp.dll" scan --json > "$RUNNER_TEMP/scan.json"
          cat "$RUNNER_TEMP/scan.json"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-capture
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/dual-target/.offramp/msbuild.binlog
            ${{ runner.temp }}/dual-target/.offramp/build.complog
            ${{ runner.temp }}/dual-target/.offramp/workspace.json

  build-test:
    name: ${{ matrix.os }}
    needs: windows-capture
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs tags

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - uses: actions/download-artifact@v4
        with:
          name: windows-capture
          path: artifacts/windows-capture

      - name: Test
        env:
          OFFRAMP_WINDOWS_CAPTURE: ${{ github.workspace }}/artifacts/windows-capture
          # Seconds the test host waits for the data collector (default 90; slow Windows runners miss it).
          VSTEST_CONNECTION_TIMEOUT: "300"
        run: >-
          dotnet test --no-build -c Release
          --filter "Category!=Corpus&Category!=Slow"
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --blame-hang-timeout 15m
          --blame-hang-dump-type none

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/**"

  pack:
    name: Pack (smoke)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack tool
        run: dotnet pack src/Offramp.Cli -c Release -o artifacts
      - name: Install and run the packed tool
        run: |
          dotnet tool install -g offramp --add-source ./artifacts --prerelease
          offramp --version
          offramp doctor --json > doctor.json || true
          cat doctor.json
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  changelog:
    name: Changelog updated
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG.md change in this PR
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          if git diff --quiet "origin/$BASE_REF...HEAD" -- CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::This pull request does not update CHANGELOG.md. Add an entry under [Unreleased] or apply the 'skip-changelog' label."
            exit 1
          fi
