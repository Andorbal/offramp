name: Corpus

# Opt-in and slow: runs Offramp on real open-source .NET Framework codebases
# (tests/Offramp.Corpus.Tests/codebases.json; how to add one: tests/Offramp.Corpus.Tests/README.md).
# Only on request, one job per codebase, so one codebase's failure or timeout never hides another's.

on:
  workflow_dispatch:
    inputs:
      codebases:
        description: "Codebase names from tests/Offramp.Corpus.Tests/codebases.json, comma-separated, or 'all'"
        required: true
        default: all

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          WANTED: ${{ inputs.codebases }}
        run: |
          matrix=$(jq -c --arg wanted "$WANTED" '
            ($wanted | split(",") | map(gsub("^\\s+|\\s+$"; ""))) as $names
            | [ .[] | select($wanted == "all" or (.name as $n | $names | index($n) != null)) | { name, commit, timeoutMinutes } ]
          ' tests/Offramp.Corpus.Tests/codebases.json)
          if [ "$matrix" = "[]" ]; then
            echo "::error::No codebase in tests/Offramp.Corpus.Tests/codebases.json matches '$WANTED'."
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  corpus:
    needs: select
    name: corpus (${{ matrix.codebase.name }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.codebase.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix:
        codebase: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The pinned commit, fetched once per commit; the harness checks it before every run.
      - uses: actions/cache@v4
        with:
          path: tests/.cache/corpus/${{ matrix.codebase.name }}
          key: corpus-${{ matrix.codebase.name }}-${{ matrix.codebase.commit }}
      - name: Build
        run: dotnet build -c Release
      - name: Corpus test
        env:
          OFFRAMP_CORPUS: ${{ matrix.codebase.name }}
        run: >
          dotnet test tests/Offramp.Corpus.Tests --no-build -c Release
          --filter "Category=Corpus&Codebase=${{ matrix.codebase.name }}"
          --logger "trx;LogFileName=corpus.trx"
          --logger "console;verbosity=normal"
      - name: Summary
        if: always()
        run: |
          summary=artifacts/corpus-output/${{ matrix.codebase.name }}/summary.md
          if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-${{ matrix.codebase.name }}
          path: |
            **/TestResults/**
            artifacts/corpus-output/**
