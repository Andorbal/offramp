<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="offramp report">
<title>{{TITLE}}</title>
<style>
:root {
  --bg: #ffffff; --panel: #f7fafc; --rule: #e2e8f0; --text: #1a202c; --muted: #4a5568;
  --ready: #2F855A; --blocked: #C53030; --done: #4a5568;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #171923; --panel: #1f2330; --rule: #2d3748; --text: #e2e8f0; --muted: #a0aec0; --ready: #68D391; --blocked: #FC8181; --done: #a0aec0; }
}
* { box-sizing: border-box; }
body { margin: 0 auto; max-width: 960px; padding: 24px 16px 48px; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
h1 { font-size: 26px; margin: 0 0 4px; }
h2 { font-size: 18px; margin: 36px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
p.meta, p.note, figcaption, .muted { color: var(--muted); }
p.meta { margin: 0 0 20px; font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; }
.tile .value { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .label { font-size: 13px; color: var(--muted); }
figure { margin: 8px 0 0; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; list-style: none; padding: 0; margin: 0 0 8px; font-size: 13px; }
.legend li { display: flex; align-items: center; gap: 6px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
svg.chart text.label { fill: var(--text); }
svg.chart .grid { stroke: var(--rule); stroke-width: 1; }
svg.chart .band { fill-opacity: .8; }
svg.chart .burn { stroke-width: 2.5; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
code { font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; }
.status { font-weight: 600; white-space: nowrap; }
.status.done { color: var(--done); }
.status.ready { color: var(--ready); }
.status.blocked { color: var(--blocked); }
iframe.graph { width: 100%; height: 640px; border: 1px solid var(--rule); border-radius: 8px; }
footer { margin-top: 40px; font-size: 12px; color: var(--muted); }
@media print {
  :root { --bg: #ffffff; --panel: #ffffff; --rule: #cbd5e0; --text: #000000; --muted: #333333; --ready: #22543d; --blocked: #9b2c2c; --done: #333333; }
  body { max-width: none; padding: 0; font-size: 11pt; }
  section, figure, tr { break-inside: avoid; }
  h2 { break-after: avoid; }
  .graph-section { display: none; }
}
</style>
</head>
<body>
{{BODY}}
</body>
</html>
