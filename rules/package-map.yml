# Framework-era NuGet packages and their modern successors, used by `deps audit`
# (docs/spec/commands/deps.md). Extend or override from offramp.yml with
# `deps.packageMap`. `package` matches one id; `prefix` matches ids starting
# with it (the longest prefix wins; an exact `package` beats any prefix).
packages:
  - package: Microsoft.AspNet.WebApi.Core
    replacement: ASP.NET Core MVC (Microsoft.AspNetCore.App, part of the shared framework)
  - prefix: Microsoft.AspNet.WebApi.
    replacement: ASP.NET Core MVC (Microsoft.AspNetCore.App, part of the shared framework)
  - package: Microsoft.AspNet.Mvc
    replacement: ASP.NET Core MVC (Microsoft.AspNetCore.App, part of the shared framework)
  - package: Microsoft.AspNet.Razor
    replacement: Razor in ASP.NET Core
  - package: Microsoft.AspNet.WebPages
    replacement: Razor Pages in ASP.NET Core
  - prefix: Microsoft.AspNet.Identity.
    replacement: Microsoft.AspNetCore.Identity
  - prefix: Microsoft.AspNet.SignalR
    replacement: ASP.NET Core SignalR (Microsoft.AspNetCore.SignalR)
  - prefix: Microsoft.Owin
    replacement: ASP.NET Core middleware
  - package: Owin
    replacement: ASP.NET Core middleware
  - package: Microsoft.Web.Infrastructure
    replacement: none; it is part of System.Web
  - package: Topshelf
    replacement: Microsoft.Extensions.Hosting (Windows service or systemd hosting)
  - package: System.Data.SqlClient
    replacement: Microsoft.Data.SqlClient
  - package: Swashbuckle
    replacement: Swashbuckle.AspNetCore
  - package: Swashbuckle.Core
    replacement: Swashbuckle.AspNetCore
  - package: EntityFramework
    replacement: EntityFramework 6.4 or later (supports netstandard2.1), or Microsoft.EntityFrameworkCore
  - package: WindowsAzure.Storage
    replacement: Azure.Storage.Blobs, Azure.Storage.Queues, Azure.Data.Tables
  - package: Microsoft.WindowsAzure.ConfigurationManager
    replacement: Microsoft.Extensions.Configuration
  - package: System.Runtime.Serialization.Formatters
    replacement: none supported; BinaryFormatter is removed, use another serializer
  - package: Microsoft.ApplicationInsights.Web
    replacement: Microsoft.ApplicationInsights.AspNetCore
  - package: NLog.Web
    replacement: NLog.Web.AspNetCore
  - package: Autofac.WebApi2
    replacement: Autofac.Extensions.DependencyInjection
  - package: Autofac.Mvc5
    replacement: Autofac.Extensions.DependencyInjection
  - package: Microsoft.Net.Http
    replacement: built in (System.Net.Http)
  - prefix: Microsoft.Bcl
    replacement: built in on modern .NET
  - package: Unity
    replacement: Unity.Container, or Microsoft.Extensions.DependencyInjection
  - prefix: Microsoft.Practices.Unity
    replacement: Unity.Container, or Microsoft.Extensions.DependencyInjection
  - prefix: Microsoft.Practices.EnterpriseLibrary
    replacement: none; each block has a modern library (Polly for transient faults, Microsoft.Extensions.Logging for logging, Microsoft.Extensions.Caching for caching)
  - package: Ninject
    replacement: Microsoft.Extensions.DependencyInjection (or Autofac)
  - package: StructureMap
    replacement: Lamar
  - package: CommonServiceLocator
    replacement: Microsoft.Extensions.DependencyInjection
  - package: Common.Logging
    replacement: Microsoft.Extensions.Logging
  - package: Microsoft.IdentityModel.Clients.ActiveDirectory
    replacement: Microsoft.Identity.Client (MSAL)
  - package: WindowsAzure.ServiceBus
    replacement: Azure.Messaging.ServiceBus
  - prefix: Microsoft.Azure.ServiceBus
    replacement: Azure.Messaging.ServiceBus
  - prefix: Microsoft.Azure.KeyVault
    replacement: Azure.Security.KeyVault.Secrets, Azure.Security.KeyVault.Keys, Azure.Security.KeyVault.Certificates
  - package: Microsoft.Azure.DocumentDB
    replacement: Microsoft.Azure.Cosmos
  - package: Microsoft.Azure.DocumentDB.Core
    replacement: Microsoft.Azure.Cosmos
  - prefix: Microsoft.Azure.Storage
    replacement: Azure.Storage.Blobs, Azure.Storage.Queues, Azure.Storage.Files.Shares
  - package: Oracle.ManagedDataAccess
    replacement: Oracle.ManagedDataAccess.Core
  - package: RhinoMocks
    replacement: Moq or NSubstitute
  - package: MiniProfiler
    replacement: MiniProfiler.AspNetCore.Mvc
  - package: elmah
    replacement: ElmahCore
  - package: Elmah.MVC
    replacement: ElmahCore.Mvc
  - package: Microsoft.AspNet.Web.Optimization
    replacement: a bundler at build time (LibMan, esbuild, or WebOptimizer); ASP.NET Core has no bundling runtime
  - package: WebGrease
    replacement: none; it served Microsoft.AspNet.Web.Optimization
  - package: Antlr
    replacement: none; it served Microsoft.AspNet.Web.Optimization
  - package: WebActivatorEx
    replacement: none; startup code moves to Program.cs
  - package: Microsoft.CodeDom.Providers.DotNetCompilerPlatform
    replacement: none; ASP.NET Core compiles Razor at build time
  - package: Microsoft.Net.Compilers
    replacement: none; the SDK's compiler
  - package: Microsoft.Net.Compilers.Toolset
    replacement: none; the SDK's compiler
  - prefix: Microsoft.jQuery.Unobtrusive
    replacement: client libraries through LibMan or npm (jquery-validation-unobtrusive, jquery-ajax-unobtrusive)
  - package: jQuery
    replacement: client libraries through LibMan or npm
  - package: jQuery.Validation
    replacement: client libraries through LibMan or npm
  - package: bootstrap
    replacement: client libraries through LibMan or npm
  - package: Modernizr
    replacement: client libraries through LibMan or npm
  - package: EntityFramework.SqlServerCompact
    replacement: none; SQL Server Compact is discontinued, SQLite (Microsoft.EntityFrameworkCore.Sqlite) is the usual destination
  - package: Microsoft.SqlServer.Compact
    replacement: none; SQL Server Compact is discontinued, SQLite is the usual destination
  - package: Microsoft.Data.OData
    replacement: Microsoft.OData.Core
  - package: Microsoft.Data.Edm
    replacement: Microsoft.OData.Edm
  - prefix: DotNetOpenAuth
    replacement: ASP.NET Core authentication handlers (Microsoft.AspNetCore.Authentication.*)
  - package: iTextSharp
    replacement: itext (version 7 and later; the license changed to AGPL, check it)
  - prefix: Glimpse
    replacement: none; use ASP.NET Core's diagnostics middleware or MiniProfiler.AspNetCore
