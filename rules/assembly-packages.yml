# Packages whose id differs from the assembly they ship, used by `deps resolve-dlls`
# (docs/spec/commands/deps.md): a DLL referenced by HintPath is looked up under these
# package ids as well as the id that equals its assembly name, and the best match wins
# (ADR 0042). Extend or override from offramp.yml with `deps.assemblyPackages`
# (`- assembly: Name` / `package: Id`); an assembly may have several packages.
assemblies:
  - assembly: nunit.framework
    package: NUnit
  - assembly: Rhino.Mocks
    package: RhinoMocks
  - assembly: Microsoft.VisualStudio.TestPlatform.TestFramework
    package: MSTest.TestFramework
